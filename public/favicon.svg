<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </linearGradient>

    <!-- Daytona Orange Metallic Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#CC2900"/>
    </linearGradient>

    <!-- Chrome Edge Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D0D5DD"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#2D3748" stroke-width="2"/>

  <!-- Orange Ambient Glow -->
  <circle cx="64" cy="68" r="38" fill="#FF5500" opacity="0.22" filter="blur(14px)"/>

  <!-- Daytona Stylized Speed Emblem 'D' -->
  <!-- Chrome Underlay / Outline -->
  <path d="M 34 32 L 86 32 C 90 32 94 34 96 36 L 106 36 L 94 43 L 102 43 L 88 51 L 96 51 C 86 67 76 83 58 92 C 48 97 38 96 32 96 L 44 84 C 54 84 62 82 70 74 C 78 66 82 56 80 48 L 48 48 L 34 32 Z" 
        fill="url(#chromeGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Vibrant Orange Core -->
  <path d="M 37 35 L 83 35 C 87 35 90 37 92 39 L 98 39 L 89 45 L 94 45 L 83 53 L 88 53 C 79 67 71 80 56 88 C 47 92 40 92 35 92 L 44 82 C 53 82 60 80 67 73 C 74 65 77 56 75 50 L 49 50 L 37 35 Z" 
        fill="url(#orangeGrad)" filter="url(#neonGlow)"/>

  <!-- Speed Needle Accent Inside D -->
  <path d="M 46 80 L 52 56 L 62 56 C 63 64 59 74 53 79 Z" fill="url(#chromeGrad)"/>
  <path d="M 48 77 L 53 58 L 59 58 C 60 64 57 72 52 76 Z" fill="url(#orangeGrad)"/>
</svg>